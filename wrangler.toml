name = "jobradar-ai"
main = "src/index.ts"
compatibility_date = "2026-01-15"

[vars]
PREMIUM_ENABLED = "false"
CHANNEL_AUTO_PUBLISH = "false"
FEEDS_JSON = "[]"

[[d1_databases]]
binding = "DB"
database_name = "jobradar-ai"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[ratelimits]]
name = "PUBLIC_LIMIT"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[triggers]
crons = ["* * * * *", "17 */6 * * *"]

[observability]
enabled = true
